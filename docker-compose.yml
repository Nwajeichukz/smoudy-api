version: '3.8'

services:
  jenkins:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: smoudy-jenkins
    restart: unless-stopped
    ports:
      - "9090:8080"    # Jenkins UI
      - "50000:50000"  # Jenkins agents
    volumes:
      - jenkins_home:/var/jenkins_home
      - jenkins_m2:/var/jenkins_home/.m2
      - /var/run/docker.sock:/var/run/docker.sock # Crucial for deploying containers
    environment:
      - JAVA_OPTS=-Djenkins.install.runSetupWizard=false

volumes:
  jenkins_home:
  jenkins_m2: